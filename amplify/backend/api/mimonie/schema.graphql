type Contribution @model @auth(rules: [{allow: public}]) {
  id: ID!
  name: String
  title: String
  category: String
  start_date: AWSDate
  invite_link: AWSURL
  contributiongroupsID: ID! @index(name: "byContributionGroups")
  participant: [ID]
  owner: String!
  target: Int!
  amount: Int!
  num_of_month: Int!
  status: String
}

type ContributionGroups @model @auth(rules: [{allow: public}]) {
  id: ID!
  description: String
  status: String!
  target: Int!
  title: String
  body_color: String
  side_color: String
  amount: Int!
  name: String!
  num_of_month: Int
  Contributions: [Contribution] @hasMany(indexName: "byContributionGroups", fields: ["id"])
}
 