type UserBankDetails @model @auth(rules: [{ allow: public }]) {
  id: ID!
  userId: String!
  bank_code: String!
  bank_number: String!
  index: String
  extra: AWSJSON
  status: String!
  bank_name: String!
}

type PersonalContribution @model @auth(rules: [{ allow: public }]) {
  id: ID!
  name: String
  status: String
  variant: String
  amount: Int
  target: Int
  last_successful_contribution: String
  currently_at: Int
  extra: AWSJSON
}

type UserActivity @model @auth(rules: [{ allow: public }]) {
  id: ID!
  type: String
  amount: Int
  description: String
  userId: ID
  status: String
  extra: AWSJSON
}

type UserNotifications @model @auth(rules: [{ allow: public }]) {
  id: ID!
  type: String
  content: String
  title: String
  read: Boolean
  userId: ID
  global: Boolean
}

type UserProfile @model @auth(rules: [{ allow: public }]) {
  id: ID!
  name: String
  preferred_username: String
  phone_number: String
  birthdate: AWSDate
  address: String
  income_from: Int
  income_to: Int
  occupation: String
  country_of_residence: String
  country_of_origin: String
  email: AWSEmail
  auth_url: String
  invites: [String]
  is_bvn_verified: Boolean
  is_nin_verified: Boolean
  device_id: String
  userId: ID
  customer_code: String
  verification_in_progress: Boolean
  subaccount_code: String
  bank_details: AWSJSON
  device_name: String
  device_brand: String
  verification_in_progress_id: Boolean
  connections: [AWSJSON]
  phone_verified: Boolean
  push_token: String
  dva: AWSJSON
  extra: AWSJSON
  recipient_code: String
  transfer_pin: String
  is_admin: Boolean
}

type UserCardDetails @model @auth(rules: [{ allow: public }]) {
  id: ID!
  last4: String
  bank: String
  userId: ID
  type: String
  expiry: String
  authorization_code: String
  status: String
}

type Contribution @model @auth(rules: [{ allow: public }]) {
  id: ID!
  name: String
  title: String
  category: String
  start_date: AWSDate
  invite_link: AWSURL
  contributiongroupsID: ID! @index(name: "byContributionGroups")
  participant: [AWSJSON]
  owner: String!
  target: Int!
  amount: Int!
  num_of_month: Int!
  status: String
  participant_ids: [ID]
  currently_at: Int
  variant: String
  current_count: Int
  type: String
}

type ContributionGroups @model @auth(rules: [{ allow: public }]) {
  id: ID!
  description: String
  status: String!
  target: Int!
  title: String
  body_color: String
  side_color: String
  amount: Int!
  name: String!
  num_of_month: Int
  Contributions: [Contribution]
    @hasMany(indexName: "byContributionGroups", fields: ["id"])
  variant: String!
}

type Request @model @auth(rules: [{ allow: public }]) {
  id: ID!
  type: String
  userId: String
  user_email: AWSEmail
  user_name: String
  status: String
  reason: String
  extra: AWSJSON
}

type UserConnections @model @auth(rules: [{ allow: public }]) {
  id: ID!
  senderId: String!
  receiverId: String!
  senderDetails: AWSJSON
  receiverDetails: AWSJSON
  status: String!
}

type ContributionParticipant @model @auth(rules: [{ allow: public }]) {
  id: ID!
  contributionID: ID!
  userId: ID!
  name: String
  email: AWSEmail
  status: String
  index: Int
  subaccount_code: String
  auth_url: String
  last_successful_round: Int
  contributions: Int
  push_token: String
  recipient: String
  extra: AWSJSON
  type: String
}
